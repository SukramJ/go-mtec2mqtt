# M-TEC external MODBUS RTU server
MODBUS_IP: 0.0.0.0 # IP address / hostname of "espressif" modbus server
MODBUS_PORT: 502 # Port (usually no change required)
MODBUS_SLAVE: 247 # Modbus slave id (usually no change required)
MODBUS_TIMEOUT: 5 # Timeout for Modbus server (s)
MODBUS_RETRIES: 3 # Retries
MODBUS_FRAMER: socket # Modbus Framer (usually no change required; options: 'ascii', 'binary', 'rtu', 'socket', 'tls')

# MQTT settings
# Credentials can also be provided via the MTEC_MQTT_LOGIN /
# MTEC_MQTT_PASSWORD environment variables.
MQTT_SERVER: localhost # MQTT server
MQTT_PORT: 1883 # MQTT server port (default: 1883 plain, 8883 when MQTT_SSL is true)
MQTT_LOGIN: " " # MQTT Login (override: env MTEC_MQTT_LOGIN)
MQTT_PASSWORD: "" # MQTT Password (override: env MTEC_MQTT_PASSWORD)
MQTT_TOPIC: MTEC # MQTT topic name
MQTT_FLOAT_FORMAT: "{:.3f}" # Defines how to format float values
# MQTT_SSL: false            # Connect via TLS (tls://) instead of plain TCP
# MQTT_SSL_INSECURE: false   # DANGEROUS: skip broker certificate verification
#                             # (self-signed certs only); only takes effect
#                             # when MQTT_SSL is true. Never enable this
#                             # against a broker you do not fully trust.

# Refresh interval  / override when needed
# REFRESH_NOW: 10            # Refresh "now" data every N seconds
# REFRESH_DAY: 300           # Refresh "day" statistic every N seconds
# REFRESH_TOTAL: 300         # Refresh "total" statistic every N seconds
# REFRESH_CONFIG: 30         # Refresh "config" data every N seconds
# REFRESH_STATIC: 3600       # Refresh "static" data every N seconds

# Home Assistant support
HASS_ENABLE: false # Enable home assistant
HASS_BASE_TOPIC: homeassistant # Basis MQTT topic of home assistant
HASS_BIRTH_GRACETIME: 15 # Give HASS some time to get ready after the birth message was received

# Web UI (optional status / health dashboard)
# When enabled, the daemon serves a small embedded single-page app with
# live status, health and the current register values, plus edit controls
# for the writable registers. Off by default — the daemon stays a pure
# MQTT bridge unless you opt in.
WEB_ENABLE: false # Enable the embedded web UI
WEB_BIND: 127.0.0.1:8080 # Listen address host:port (use 0.0.0.0:8080 for LAN access)
WEB_USER: "" # HTTP Basic auth user (leave empty + WEB_PASSWORD empty to disable auth)
WEB_PASSWORD: "" # HTTP Basic auth password (override: env MTEC_WEB_PASSWORD)

# Localisation
# Display language for the web dashboard and the friendly names of Home
# Assistant entities. Entity_ids stay language-independent, so switching
# language never re-creates HA entities. Options: 'en' (default), 'de'.
LANGUAGE: en

# Charge / discharge "active" switches
# Two extra Home Assistant switch entities ("Charge active" / "Discharge
# active"). Turning one on writes the configured amperage to the charge/
# discharge limit register; turning it off writes 0. The last active value
# is remembered and restored on the next "on"; these settings are the
# initial fallback. Plain numbers (the register's native unit, default 50).
CHARGE_ACTIVE_VALUE: 50
DISCHARGE_ACTIVE_VALUE: 50

# General
DEBUG: false # Set to True to get verbose debug messages
