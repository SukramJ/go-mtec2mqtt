# ------------------------------------------------------------------
# Modbus registers
"10000":
  name: Inverter serial number
  name_de: "Wechselrichter-Seriennummer"
  length: 8
  type: STR
  mqtt: serial_no
  group: static

"10008":
  name: Equipment info
  name_de: "Geräteinformation"
  length: 1
  type: BYTE
  mqtt: equipment_info
  group: static

"10011":
  name: Firmware version
  name_de: "Firmware-Version"
  length: 4
  type: BYTE
  mqtt: firmware_version
  group: static

"10100":
  name: Inverter date
  name_de: "Wechselrichter-Datum"
  length: 3
  type: DAT
  mqtt: inverter_date
  group: now-base

"10105":
  name: Inverter status
  name_de: "Wechselrichter-Status"
  length: 1
  type: U16
  mqtt: inverter_status
  group: now-base
  hass_device_class: enum
  hass_value_items:
    {
      0: "wait for on-grid",
      1: "self-check",
      2: "on-grid",
      3: "fault",
      4: "firmware update",
      5: "off grid",
    }
  hass_value_items_de:
    {
      0: "Warte auf Netzbetrieb",
      1: "Selbsttest",
      2: "Netzbetrieb",
      3: "Fehler",
      4: "Firmware-Update",
      5: "Inselbetrieb",
    }

"10112":
  name: Fault flag1
  name_de: "Fehler-Flag 1"
  length: 2
  type: BIT
  mqtt: fault_flag_1
  group: now-base
  hass_value_items:
    {
      1: "Mains Lost",
      2: "Grid Voltage Fault",
      4: "Grid Frequency Fault",
      8: "DCI Fault",
      16: "ISO Over Limitation",
      32: "GFCI Fault",
      64: "PV Over Voltage",
      128: "Bus Voltage Fault",
    }
  hass_value_items_de:
    {
      1: "Netzausfall",
      2: "Netzspannungsfehler",
      4: "Netzfrequenzfehler",
      8: "DCI-Fehler",
      16: "ISO-Grenzwertüberschreitung",
      32: "GFCI-Fehler",
      64: "PV-Überspannung",
      128: "Bus-Spannungsfehler",
    }
  # Deliberately no hass_device_class: the published state is a
  # comma-separated list of active faults (or "OK"), which Home
  # Assistant's options-based `enum` device class cannot represent.
  # hass_value_items stays — it drives that label conversion.

"10114":
  name: Fault flag2
  name_de: "Fehler-Flag 2"
  length: 2
  type: BIT
  mqtt: fault_flag_2
  group: now-base
  hass_value_items:
    {
      2: "SPI Fault",
      4: "E2 Fault",
      8: "GFCI Device Fault",
      16: "AC Transducer Fault",
      32: "Relay Check Fail",
      64: "Iternal Fan Fault",
    }
  hass_value_items_de:
    {
      2: "SPI-Fehler",
      4: "E2-Fehler",
      8: "GFCI-Gerätefehler",
      16: "AC-Wandler-Fehler",
      32: "Relais-Prüfung fehlgeschlagen",
      64: "Interner Lüfterfehler",
    }
  # No hass_device_class — see 10112.

# "10120":
#   name: Fault flag3
#   length: 2
#   type: BIT
#   mqtt: fault_flag_3
#   group: now-base
#   # No hass_device_class — see 10112.

