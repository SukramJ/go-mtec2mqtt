"33000":
  name: Battery SOC
  name_de: "Batterie-SOC"
  length: 1
  type: U16
  unit: "%"
  scale: 100
  mqtt: battery_soc
  group: now-base
  hass_device_class: battery
  hass_value_template: "{{ value | round(1) }}"
  hass_state_class: measurement

"33001":
  name: Battery SOH
  name_de: "Batterie-SOH"
  length: 1
  type: U16
  unit: "%"
  scale: 100
  mqtt: battery_soh
  group: now-battery
  hass_device_class: power_factor
  hass_value_template: "{{ value | round(2) }}"
  hass_state_class: measurement

"33002":
  name: BMS Status
  name_de: "BMS-Status"
  length: 1
  type: U16
  mqtt: bms_status
  group: now-base
  hass_device_class: enum
  hass_value_items:
    {
      0: "wait for on-grid",
      1: "self-check",
      2: "on-grid",
      3: "fault",
      4: "firmware update",
      5: "off grid",
    }
  hass_value_items_de:
    {
      0: "Warte auf Netzbetrieb",
      1: "Selbsttest",
      2: "Netzbetrieb",
      3: "Fehler",
      4: "Firmware-Update",
      5: "Inselbetrieb",
    }

"33003":
  name: Battery temperature
  name_de: "Batterietemperatur"
  length: 1
  # Signed: battery temperatures go below 0 °C. Upstream (Python
  # MTECmqtt) declares U16 here, which publishes -0.5 °C as 6553.1 °C.
  type: I16
  unit: "°C"
  scale: 10
  mqtt: battery_temp
  group: now-battery
  hass_device_class: temperature
  hass_value_template: "{{ value | round(1) }}"
  hass_state_class: measurement

"33009":
  name: Battery cell temperature max.
  name_de: "Batteriezellen-Temperatur max."
  length: 1
  # Signed — see 33003.
  type: I16
  unit: "°C"
  scale: 10
  mqtt: battery_cell_t_max
  group: now-battery
  hass_device_class: temperature
  hass_value_template: "{{ value | round(1) }}"
  hass_state_class: measurement

"33011":
  name: Battery cell temperature min.
  name_de: "Batteriezellen-Temperatur min."
  length: 1
  # Signed — see 33003.
  type: I16
  unit: "°C"
  scale: 10
  mqtt: battery_cell_t_min
  group: now-battery
  hass_device_class: temperature
  hass_value_template: "{{ value | round(1) }}"
  hass_state_class: measurement

"33013":
  name: Battery cell voltage max.
  name_de: "Batteriezellen-Spannung max."
